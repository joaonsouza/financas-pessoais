[project]
name = "app-financas"
version = "0.1.0"
description = "App local de finanças pessoais"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
    "pdfplumber>=0.11.10",
    "anthropic>=1.11.0",
    "keyring>=25.7.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "amostra_real: usa amostras reais do Drive ou de FINANCAS_AMOSTRAS (pulado se a pasta não existir)",
]
